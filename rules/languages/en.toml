# English: our safety text for every country that uses this language.
# The checker uses the unsafe phrases of ALL languages on every message, so a mixed-language
# reply is still checked. Messages are sent when the AI fails; "TODO" text falls back to English.

[unsafe_phrases]
# "Go to high ground" is unsafe on its own (landslides: Irshalwadi 2023): it must come with a
# slope-safety word in the same message.
# "Higher ground" too (Nov 3 2026 real-model eval: "Move livestock to higher ground." got through).
high_ground = ["high ground", "higher ground", "higher land", "high land"]
slope_safety_words = ["slope"]
# Every flood warning must keep people away from rivers and out of flowing water (Vijayawada,
# Nov 3 2026: a live draft said only "move to a sturdy building"). One word of each list.
flood_rivers = ["river"]
flood_flowing_water = ["flowing water"]
# We never ask for money or OTPs, never claim to be official, and never claim to agree with
# official warnings: replays and most mornings have none to agree with (Nov 3 2026 real-model
# eval: "This heat warning is in line with official IMD/government warnings").
never_say = ["otp", "send money", "official warning service", "in line with official",
             "contradict any official", "not contradict", "aligns with"]
# Never tell someone they are safe: our checks can miss what officials see (Oct 31 cyclone).
claims_safe = ["safe to work", "safe to go out", "no danger", "nothing to worry", "no risk this week"]
# Words for units: a number followed by one of these must come from the tool data, like °C or mm.
unit_words = ["degrees", "degree", "percent", "per cent", "millimetres", "millimeters", "kilometres", "kilometers"]

[safe_messages]
general = "We could not prepare your answer right now. For emergencies call 112. For disaster help call 1077. Please try again in a few minutes."
heat = "Heat warning for your area. Work before 10 am and after 5 pm, drink water often, rest in shade. Signs of heatstroke: confusion, no sweat, fainting: cool the person and call 108. Disaster help: 1077."
flood = "Flood risk for your area. Move to a safe place away from rivers and away from hill slopes. Never cross flowing water. Call 112 / 1077."
all_clear = "The weather risk we warned you about has eased in the latest forecasts. Keep following IMD and local officials. If water is still standing or someone is unwell, call 112 / 1077."

[footer]
text = "Not an official warning service; follow IMD. We never ask for money or OTP. Was this useful? 1 Yes / 2 No"

