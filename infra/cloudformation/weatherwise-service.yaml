AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  WeatherWise public ECS Fargate service. It uses an ALB, ECR image,
  CloudWatch logs, least-privilege task roles, and an optional AWS WAF web ACL.

Parameters:
  ImageUri:
    Type: String
    Description: Immutable ECR image URI, for example ACCOUNT.dkr.ecr.us-east-2.amazonaws.com/weatherwise:SHA.
  CertificateArn:
    Type: String
    Default: ''
    Description: Optional pre-existing ACM certificate ARN. DomainName and HostedZoneId are preferred.
  DomainName:
    Type: String
    Default: ''
    Description: Optional custom apex domain, for example weatherwise.online.
  HostedZoneId:
    Type: String
    Default: ''
    Description: Route 53 public hosted-zone ID for DomainName. Required with DomainName.
  ClimateAgentModelId:
    Type: String
    Default: us.amazon.nova-micro-v1:0
    Description: Bedrock foundation-model or inference-profile ID used by the service.
  OpenMeteoSecretArn:
    Type: String
    Default: ''
    NoEcho: true
    Description: Optional Secrets Manager ARN containing the OPEN_METEO_API_KEY secret value.
  EnableWaf:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Enable the baseline WAF rules. This adds AWS WAF charges.
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 1
    Description: Keep one task because chats and the forecast cache are in memory.

Conditions:
  HasOpenMeteoSecret: !Not [!Equals [!Ref OpenMeteoSecretArn, '']]
  HasProvidedCertificate: !Not [!Equals [!Ref CertificateArn, '']]
  HasCustomDomain: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]
  HasCertificate: !Or [!Condition HasProvidedCertificate, !Condition HasCustomDomain]
  UseWaf: !Equals [!Ref EnableWaf, 'true']

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.42.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{Key: Name, Value: weatherwise-vpc}]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      InternetGatewayId: !Ref InternetGateway
      VpcId: !Ref Vpc

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc

  DefaultPublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [0, !GetAZs '']
      CidrBlock: 10.42.0.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      AvailabilityZone: !Select [1, !GetAZs '']
      CidrBlock: 10.42.1.0/24
      MapPublicIpOnLaunch: true
      VpcId: !Ref Vpc

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetA

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnetB

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Public load-balancer access to WeatherWise
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Only the ALB can reach the WeatherWise task
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      Type: application

  Certificate:
    Condition: HasCustomDomain
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub 'www.${DomainName}']
      ValidationMethod: DNS
      DomainValidationOptions:
        - DomainName: !Ref DomainName
          HostedZoneId: !Ref HostedZoneId
        - DomainName: !Sub www.${DomainName}
          HostedZoneId: !Ref HostedZoneId

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions: !If
        - HasCertificate
        - - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: '443'
              StatusCode: HTTP_301
        - - Type: forward
            TargetGroupArn: !Ref TargetGroup

  HttpsListener:
    Condition: HasCertificate
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      Certificates:
        - CertificateArn: !If [HasCustomDomain, !Ref Certificate, !Ref CertificateArn]
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  WwwToApexRedirect:
    Condition: HasCustomDomain
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 1
      Conditions:
        - Field: host-header
          HostHeaderConfig:
            Values: [!Sub 'www.${DomainName}']
      Actions:
        - Type: redirect
          RedirectConfig:
            Host: !Ref DomainName
            Protocol: HTTPS
            Port: '443'
            StatusCode: HTTP_301

  ApexDnsRecord:
    Condition: HasCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

  WwwDnsRecord:
    Condition: HasCustomDomain
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub www.${DomainName}
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      HealthCheckPath: /api/status
      HealthCheckProtocol: HTTP
      Matcher: {HttpCode: '200'}
      Port: 8080
      Protocol: HTTP
      TargetType: ip
      VpcId: !Ref Vpc

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/weatherwise
      RetentionInDays: 14

  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: weatherwise

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  ExecutionRoleSecretPolicy:
    Condition: HasOpenMeteoSecret
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: read-weatherwise-secret
      Roles: [!Ref ExecutionRole]
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action: secretsmanager:GetSecretValue
            Resource: !Ref OpenMeteoSecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-approved-bedrock-models
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['bedrock:InvokeModel', 'bedrock:InvokeModelWithResponseStream']
                Resource:
                  - !Sub arn:${AWS::Partition}:bedrock:*::foundation-model/*
                  - !Sub arn:${AWS::Partition}:bedrock:*:${AWS::AccountId}:inference-profile/*

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '1024'
      Memory: '2048'
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      RuntimePlatform: {CpuArchitecture: ARM64, OperatingSystemFamily: LINUX}
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: weatherwise
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8080}]
          Environment:
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: CLIMATE_AGENT_MODEL_ID
              Value: !Ref ClimateAgentModelId
            - Name: WEATHERWISE_CACHE_DIR
              Value: /tmp/weatherwise
            - Name: WEATHERWISE_CHATS_PER_DAY
              Value: '100'
            - Name: WEATHERWISE_CHATS_PER_MINUTE
              Value: '6'
            - Name: WEATHERWISE_TRUSTED_PROXY_HOPS
              Value: '1'
          Secrets: !If
            - HasOpenMeteoSecret
            - - Name: OPEN_METEO_API_KEY
                ValueFrom: !Ref OpenMeteoSecretArn
            - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: weatherwise

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpListener
    Properties:
      Cluster: !Ref Cluster
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DeploymentConfiguration: {MinimumHealthyPercent: 100, MaximumPercent: 200}
      LoadBalancers:
        - ContainerName: weatherwise
          ContainerPort: 8080
          TargetGroupArn: !Ref TargetGroup
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups: [!Ref ServiceSecurityGroup]
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]

  WebAcl:
    Condition: UseWaf
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: weatherwise-web-acl
      Scope: REGIONAL
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: weatherwise-web-acl
        SampledRequestsEnabled: true
      Rules:
        - Name: AWSManagedCommonRules
          Priority: 0
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: common-rules
            SampledRequestsEnabled: true
        - Name: ApiRateLimit
          Priority: 1
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              AggregateKeyType: IP
              Limit: 100
              ScopeDownStatement:
                ByteMatchStatement:
                  FieldToMatch: {UriPath: {}}
                  PositionalConstraint: STARTS_WITH
                  SearchString: /api/
                  TextTransformations: [{Priority: 0, Type: NONE}]
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: api-rate-limit
            SampledRequestsEnabled: true

  WebAclAssociation:
    Condition: UseWaf
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      ResourceArn: !Ref ApplicationLoadBalancer
      WebACLArn: !GetAtt WebAcl.Arn

Outputs:
  LoadBalancerDnsName:
    Description: Point your DNS record to this ALB hostname.
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  ServiceUrl:
    Value: !If
      - HasCustomDomain
      - !Sub https://${DomainName}
      - !Sub http://${ApplicationLoadBalancer.DNSName}
  CustomDomainCertificateArn:
    Condition: HasCustomDomain
    Description: ACM certificate managed by this stack.
    Value: !Ref Certificate
  TaskRoleArn:
    Value: !GetAtt TaskRole.Arn
