name: Bug report
description: Something does not work as it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        For a wrong or unsafe **warning**, use "Safety or translation problem" instead.
        For a **security** problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open /app and choose मराठी
        2. Search "Akola"
        3. ...
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: Screen or command, browser or OS, language. Do not include anyone's exact home location.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
