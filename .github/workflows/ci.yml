name: CI

on:
  pull_request:
  push:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check weatherwise tests scripts evals
      - name: Offline tests
        run: uv run pytest -m "not live"

  website:
    name: Website (lint + tests in en / hi / mr + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  container:
    name: Container image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (linux/amd64)
        run: docker build -t weatherwise:ci .
      - name: Smoke test
        run: |
          docker run -d --name ww -p 8080:8080 weatherwise:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/status | grep -q '"agents_ready":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/app/shelter)" = 200
          test "$(docker exec ww whoami)" = weatherwise
          docker exec ww test -s /app/geodata/ne_10m_coastline.geojson

  publish-ecr:
    name: Publish image to ECR
    needs: [server, website, container]
    # `main` is this repository's default branch. A merge into it creates this push.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ECR_PUBLISH_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Set up ARM64 image emulation
        uses: docker/setup-qemu-action@v3
      - name: Build and publish immutable image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/weatherwise:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/weatherwise:main
      - name: Build and publish AgentCore runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: agentcore
          platforms: linux/arm64
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/weatherwise:agentcore-${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/weatherwise:agentcore-main

  deploy-infrastructure:
    name: Deploy infrastructure
    needs: publish-ecr
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_CLOUDFORMATION_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Resolve immutable image URI
        id: image
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          echo "uri=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/weatherwise:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "agentcore_uri=${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com/weatherwise:agentcore-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Deploy production stack
        run: |
          aws cloudformation deploy \
            --stack-name weatherwise-prod \
            --template-file infra/cloudformation/weatherwise-service.yaml \
            --role-arn "${{ vars.AWS_CLOUDFORMATION_EXECUTION_ROLE_ARN }}" \
            --capabilities CAPABILITY_NAMED_IAM \
            --no-fail-on-empty-changeset \
            --parameter-overrides \
              ImageUri="${{ steps.image.outputs.uri }}" \
              AgentRuntimeImageUri="${{ steps.image.outputs.agentcore_uri }}" \
              ClimateAgentModelId="us.amazon.nova-micro-v1:0" \
              DomainName="${{ vars.WEATHERWISE_DOMAIN_NAME }}" \
              HostedZoneId="${{ vars.ROUTE53_HOSTED_ZONE_ID }}" \
              EnableWaf=true
      - name: Report service endpoint
        run: |
          aws cloudformation describe-stacks --stack-name weatherwise-prod \
            --query "Stacks[0].Outputs[?OutputKey=='ServiceUrl'].OutputValue" --output text
