name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server (lint + offline tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.6"
      - name: Install
        run: uv sync --frozen
      - name: Lint
        run: uv run ruff check weatherwise tests scripts evals
      - name: Offline tests
        run: uv run pytest -m "not live"

  website:
    name: Website (lint + tests in en / hi / mr + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  container:
    name: Container image (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (linux/amd64, as App Runner runs it)
        run: docker build -t weatherwise:ci .
      - name: Smoke test
        run: |
          docker run -d --name ww -p 8080:8080 weatherwise:ci
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8080/api/status && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/status | grep -q '"agents_ready":false'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/app/shelter)" = 200
          test "$(docker exec ww whoami)" = weatherwise
          docker exec ww test -s /app/geodata/ne_10m_coastline.geojson
