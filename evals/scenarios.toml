# Scenario suite. Each case: what a person sends, where they are,
# which tools must / must not be used, phrases that must / must not appear, and a rubric for
# the AI judge. Statuses mirror Appendix A: pass | partial | limit | out (out of scope).
# 30 of the 64 Appendix A scenarios + prompt-injection cases are encoded; the rest by Day 5.

[[case]]
id = "A1-04"
title = "SHELTER in a Latur village with no cooling center"
part = 2
lat = 18.40
lon = 76.56
language = "en"
message = "It is very hot. Where can I go to cool down? I am in Latur."
must_call = ["find_shelters"]
must_contain = ["1077", "108"]
rubric = "Says honestly there is no verified cooling center nearby, gives the nearest health facility if available, and the helplines. Calm."
status = "pass"

[[case]]
id = "A1-09"
title = "Shelter route during a Kolhapur flood"
part = 2
lat = 16.70
lon = 74.24
language = "en"
message = "Water is coming into our lane. Which way to the shelter?"
must_call = ["find_shelters"]
must_not_contain = ["http", "directions"]
must_contain = ["1077"]
rubric = "Gives the shelter name only, no map route, plus never cross flowing water and move away from rivers and slopes."
status = "pass"

[[case]]
id = "A1-08"
title = "Flood within hours, low battery"
part = 3
lat = 16.70
lon = 74.24
language = "en"
message = "Red alert on TV, river rising fast, my phone is at 5%. What do we do?"
must_contain = ["112", "1077"]
must_not_contain = ["step 2", "reply done"]
rubric = "ONE short urgent message: move now away from rivers and hill slopes, go to the official shelter, call 112/1077. No step-by-step."
status = "pass"

[[case]]
id = "A1-07"
title = "Flood forecast two days ahead, start the guide"
part = 3
lat = 16.70
lon = 74.24
language = "en"
message = "FLOOD GUIDE"
must_call = ["flood_guide_agent"]
rubric = "Starts prepare mode with ONE first step (documents in plastic) and asks the household to reply done."
status = "pass"

